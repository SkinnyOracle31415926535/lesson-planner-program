name: Deploy Lesson Planner to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web-editor/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: web-editor/package-lock.json
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install web editor dependencies
        working-directory: web-editor
        run: npm ci
      - name: Lint web editor
        working-directory: web-editor
        run: npm run lint
      - name: Run web editor tests
        working-directory: web-editor
        run: npm run test:layout
      - name: Build the static Pages site
        working-directory: web-editor
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-editor/dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
